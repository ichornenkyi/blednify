name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  server:
    name: Server · typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  mobile-check:
    name: Mobile · typecheck + lint + doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Expo CLI, Metro and RN 0.88 tooling run under `node` (engines: ^22.13 || ^24.3 || >=26).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx expo lint
      - run: bunx expo export --platform web
      - run: bunx expo-doctor || echo "::warning::expo-doctor reported issues"

  server-image:
    name: Server · Docker image
    needs: [server]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blednify-server:latest
            ghcr.io/${{ github.repository_owner }}/blednify-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
