# Example deployment. `docker compose up -d` from apps/server (builds locally),
# or drop `build:` to pull the CI-published image.
services:
  blednify:
    image: ghcr.io/vetos5/blednify-server:latest
    # The image also bundles the web app, so the build needs the whole repository as context.
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: blednify
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Uploads, deletes and rescans need this token. Without it they are refused (403); reads still work.
      # ALLOW_OPEN_WRITES: "1" lifts that on a trusted LAN only.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MAX_UPLOAD_MB: "200"
    # The image runs as uid/gid 1000 ("bun") and must be able to write the music folder for uploads/deletes.
    # Create it first so Docker does not create it as root: `mkdir -p music && sudo chown 1000:1000 music`.
    volumes:
      - ./music:/music
      - blednify-data:/data

volumes:
  blednify-data:
