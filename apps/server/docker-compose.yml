# Blednify server + Cloudflare Tunnel.
#
#   cp .env.example .env      # then fill in LISTEN_TOKEN, ADMIN_TOKEN and CLOUDFLARE_TUNNEL_TOKEN
#   mkdir -p music && sudo chown 1000:1000 music
#   docker compose up -d      # builds the server locally; the tunnel starts only when COMPOSE_PROFILES=tunnel
#
# Without the tunnel (LAN only), remove COMPOSE_PROFILES from .env, publish the port on the LAN ("8787:8787"
# below) and the app talks to http://<LAN-ip>:8787.
services:
  blednify:
    image: ghcr.io/vetos5/blednify-server:latest
    build: .
    container_name: blednify
    restart: unless-stopped
    # Loopback only: the tunnel reaches the server over the compose network, and Docker's published ports bypass
    # the host firewall. For LAN-only use (no tunnel), change this to "8787:8787".
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Every library read needs this token (the app sends it as a Bearer header). Without it the server
      # refuses to start, unless ALLOW_OPEN_READS=1 (trusted LAN only).
      LISTEN_TOKEN: ${LISTEN_TOKEN:-}
      ALLOW_OPEN_READS: ${ALLOW_OPEN_READS:-}
      # Uploads, deletes and rescans need this token. Without it they are refused (403); reads still work.
      # ALLOW_OPEN_WRITES: "1" lifts that on a trusted LAN only.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Cloudflare's free plan rejects request bodies over 100 MB, so stay under that behind the tunnel.
      MAX_UPLOAD_MB: "95"
      # Missing lyrics are looked up on lrclib.net (artist, title, album, duration only). "0" turns it off.
      LYRICS_ONLINE: ${LYRICS_ONLINE:-1}
      # Playlist imports (Spotify / SoundCloud / YouTube links). Optional Spotify app credentials lift the
      # 100-song limit of Spotify's public playlist page and add album names.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # The web app (install it on an iPhone from Safari: Share → Add to Home Screen). Fill ./web with
      # tools/web/deploy.sh apps/server/web; without it nothing is served at /.
      WEB_DIR: /web
    # The image runs as uid/gid 1000 ("bun") and must be able to write the music folder for uploads/deletes.
    # Create it first so Docker does not create it as root: `mkdir -p music && sudo chown 1000:1000 music`.
    volumes:
      - ./music:/music
      - ./web:/web:ro
      - blednify-data:/data

  # Outbound-only tunnel: no open ports or port forwarding on your router. The public hostname for this
  # tunnel (set in the Cloudflare dashboard) must point at http://blednify:8787.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: blednify-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in apps/server/.env}
    depends_on:
      - blednify

volumes:
  blednify-data:
