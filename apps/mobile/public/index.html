<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blednify" />
    <!-- The app draws under the bar and pads itself with the safe-area insets. With "black", iOS reports a page one
         status bar shorter than the screen and paints nothing below that, leaving a dead strip at the bottom. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0A0A0C" />
    <style id="expo-reset">
      html {
        height: 100%;
        background-color: #0a0a0c;
        -webkit-text-size-adjust: 100%;
      }
      /* Pinned to the visible screen: iOS can't scroll or push the page, e.g. when the keyboard opens. */
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #0a0a0c;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
       * iOS home-screen apps get a viewport one status bar short of the screen and paint nothing below it, even if the
       * body is taller (WebKit bug 301994). A fixed body keeps that short viewport; html and body in normal flow at
       * 100lvh make iOS grow it to the full screen. #root stays fixed so the keyboard can't push the page.
       * Not for Safari tabs: there 100lvh would put the bottom of the app behind the toolbar.
       */
      @media (display-mode: standalone) {
        html {
          height: 100lvh;
        }
        body {
          position: static;
          height: 100lvh;
          overflow: visible;
        }
        #root {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: 100lvh;
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Blednify.</noscript>
    <div id="root"></div>
  </body>
</html>
